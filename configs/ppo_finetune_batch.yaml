algorithm: PPO

env:
  id: QWOP-v1
  kwargs:
    browser: "C:/Program Files/Google/Chrome/Application/chrome.exe"
    driver: "C:/tools/chromedriver/chromedriver-win64/chromedriver.exe"
    game_in_browser: false
    stat_in_browser: false

ppo:
  policy: MlpPolicy
  learning_rate: 5.0e-5  # Gedämpfte Lernrate für das Fine-Tuning
  n_steps: 2048
  batch_size: 32        # Erhöhter Batch für glattere Updates
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1        # Engere PPO Trust-Region
  ent_coef: 0.001        # Minimale Exploration, damit er nicht bei 43m starr wird
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 500_000
  seed: 42
  n_envs: 1

paths:
  log_dir: logs/ppo_finetune
  model_dir: models/ppo_finetune