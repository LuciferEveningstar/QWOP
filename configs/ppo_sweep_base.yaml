# Basis-Config für den W&B-Sweep (siehe configs/sweep_ppo.yaml).
#
# Liefert alle NICHT-gesweepten Werte. Der Sweep überschreibt zur Laufzeit nur
# die gepunkteten Keys (ppo.learning_rate, ppo.ent_coef, env.kwargs.failure_cost)
# via wandb.config → apply_sweep_overrides() in scripts/train.py.
#
# total_timesteps ist bewusst auf das Screening-Budget (100k) gesetzt: genug, um
# klar schlechte HP-Kombis am ep_rew_mean-Trend zu trennen. Top-Kombis danach
# separat lang fahren (1M+).
algorithm: PPO

env:
  id: QWOP-v1
  kwargs: {}          # failure_cost wird vom Sweep injiziert

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4   # vom Sweep überschrieben
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0           # vom Sweep überschrieben
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 100_000
  seed: 42
  # n_envs>1 → SubprocVecEnv + Auto-Headless (im Spike verifiziert, ~1050 steps/s
  # headless). Bei RAM/CPU-Druck ggf. auf 2 reduzieren (siehe Activity Monitor).
  n_envs: 4
  checkpoint_freq: 50_000

paths:
  log_dir: logs/ppo_sweep
  model_dir: models/ppo_sweep
