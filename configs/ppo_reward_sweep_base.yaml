# Basis-Config für den Reward-Shaping-Sweep (siehe configs/sweep_reward.yaml).
#
# Liefert alle NICHT-gesweepten Werte. Der Sweep überschreibt zur Laufzeit nur
# env.reward_shaping.upright_weight und env.reward_shaping.height_threshold.
# ent_coef ist hier FEST auf 0.01 (moderate Exploration), NICHT gesweept.
#
# WICHTIG: reward_shaping.enabled + penalty_below MÜSSEN hier true sein, sonst
# greift weder der Wrapper noch der Robben-Malus.
algorithm: PPO

env:
  id: QWOP-v1
  kwargs:
    time_cost_mult: 10
    failure_cost: 10
  reward_shaping:
    enabled: true
    upright_weight: 10.0      # vom Sweep überschrieben
    height_threshold: 0.40    # vom Sweep überschrieben
    gate_on_forward: true
    penalty_below: true       # Robben (unter Schwelle) wird aktiv bestraft

ppo:
  policy: MlpPolicy
  learning_rate: 1.0e-4       # der Sweep-Gewinner aus dem ersten Lauf
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01              # FEST — moderate Exploration (nicht gesweept)
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 2_000_000
  seed: 42
  n_envs: 14                  # PC 7800X3D
  checkpoint_freq: 1_000_000

paths:
  log_dir: logs/ppo_reward_sweep
  model_dir: models/ppo_reward_sweep
