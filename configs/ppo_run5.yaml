# Run 5 — Fine-Tuning mit erhöhten n_steps (4096)
# Start: models/ppo_ent001_finetune/best.zip (= model_8650000_steps.zip, Mean +161, 75% Erfolgsrate)
# Hypothese: Größere n_steps sammeln mehr Erfahrung pro Update → stabilere Strategie
algorithm: PPO

env:
  id: QWOP-v1
  kwargs: {}

ppo:
  policy: MlpPolicy
  learning_rate: 1.0e-4
  n_steps: 4096
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 3_000_000
  seed: 42
  n_envs: 1
  eval_freq: 10_000
  checkpoint_freq: 50_000

paths:
  log_dir: logs/ppo_run5
  model_dir: models/ppo_run5
