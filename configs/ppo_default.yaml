# Default PPO configuration — placeholder, wird angepasst sobald Env steht.
algorithm: PPO

env:
  id: QwopEnv-v0          # noch nicht registriert
  kwargs: {}

ppo:
  policy: MlpPolicy       # ggf. CnnPolicy bei Pixel-Obs
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 1_000_000
  seed: 42
  n_envs: 4
  eval_freq: 10_000
  checkpoint_freq: 50_000

paths:
  log_dir: logs/ppo_default
  model_dir: models/ppo_default
