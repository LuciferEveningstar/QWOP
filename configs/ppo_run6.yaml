# Run 6 — kleinere LR + größere n_steps für mehr Robustheit
# Start: models/ppo_run5/checkpoints/model_2750000_steps.zip (94% stochastisch, 100% deterministisch)
# Ziel: >96% stochastisch
algorithm: PPO

env:
  id: QWOP-v1
  kwargs: {}

ppo:
  policy: MlpPolicy
  learning_rate: 5.0e-5
  n_steps: 8192
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 2_500_000
  seed: 42
  n_envs: 1
  eval_freq: 10_000
  checkpoint_freq: 50_000

paths:
  log_dir: logs/ppo_run6
  model_dir: models/ppo_run6
