# Weitertraining Trial 023715 (upright_weight 0.2, threshold 0.45) von 2M -> 8M.
#
# Wie ppo_continue_w01, nur mit den Werten des zweiten vielversprechenden Trials.
# Laedt dessen 2M-final.zip und trainiert +6M weiter. Checkpoints alle 500k.
#
# Start (Mac, venv aktiv, ueber Nacht — caffeinate -d &):
#   python scripts/train.py --config configs/ppo_continue_w02.yaml --run-name continue-w02 --tags experiment continue
algorithm: PPO

env:
  id: QWOP-v1
  kwargs:
    time_cost_mult: 10
    failure_cost: 10
  reward_shaping:
    enabled: true
    upright_weight: 0.2       # exakt wie Trial 023715
    height_threshold: 0.45    # exakt wie Trial 023715
    gate_on_forward: true
    penalty_below: true

ppo:
  policy: MlpPolicy
  learning_rate: 1.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 8_000_000    # von 2M weiter → +6M
  model_load_file: "models/ppo_reward_sweep_mac/i-2026-07-13-023715/final.zip"
  seed: 42
  n_envs: 2                     # MacBook Air 8GB
  checkpoint_freq: 500_000

paths:
  log_dir: logs/ppo_continue_w02
  model_dir: models/ppo_continue_w02
