# Basis-Config für den Speed-Sweep vom 2M-Stand des Trials i-2026-07-13-023715.
#
# Startet von dessen 2M-final.zip (Torso-Gewinner: upright_weight 0.2, threshold
# 0.45) und fügt den Speed-Bonus dazu. Der Sweep variiert nur speed_weight.
# Jeder Trial +2M Steps (von 2M weiter → total 4M via reset_num_timesteps=False).
algorithm: PPO

env:
  id: QWOP-v1
  kwargs:
    time_cost_mult: 10
    failure_cost: 10
  reward_shaping:
    enabled: true
    upright_weight: 0.2       # fest — wie Trial 023715
    height_threshold: 0.45    # fest — wie Trial 023715
    gate_on_forward: true
    penalty_below: true
    speed_weight: 0.1         # vom Sweep überschrieben

ppo:
  policy: MlpPolicy
  learning_rate: 1.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 4_000_000    # von 2M weiter → +2M pro Trial
  model_load_file: "models/ppo_reward_sweep_mac/i-2026-07-13-023715/final.zip"
  seed: 42
  n_envs: 14                    # PC 7800X3D
  checkpoint_freq: 1_000_000

paths:
  log_dir: logs/ppo_speed_023715
  model_dir: models/ppo_speed_023715
