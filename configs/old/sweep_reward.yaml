# W&B-Sweep: Robben-Malus (2 Parameter, 3x3 = 9 Kombis).
#
# Der Wrapper läuft im penalty_below-Modus (aus der base-Config): Robben unter
# der Höhen-Schwelle wird aktiv BESTRAFT (nicht nur unbelohnt). Getestet:
#   - env.reward_shaping.upright_weight {0.05, 0.1, 0.2}     Malus/Bonus-Stärke
#   - env.reward_shaping.height_threshold {0.35, 0.40, 0.45} Schwelle (Robber ~0.33)
# ent_coef ist FEST auf 0.01 (in der base-Config), NICHT gesweept.
# 3 x 3 = 9 Kombis → method: grid. Jeder Trial: 2.000.000 Steps.
#
# Ablauf (PC, venv aktiv):
#   # ${interpreter} greift auf diesem Windows-Setup NICHT — vor dem Erstellen die
#   # command-Zeile unten durch den vollen venv-Python-Pfad ersetzen:
#   #   D:\VSCodeProjekte\NeueKonzepteQWOP\QWOP\.venv\Scripts\python.exe
#   wandb sweep --project qwop-rl-dhbw --entity qwop-rl configs\sweep_reward.yaml
#   wandb agent qwop-rl/qwop-rl-dhbw/<sweep-id> --count 1    # Dry-Run
#   wandb agent qwop-rl/qwop-rl-dhbw/<sweep-id>              # voller Sweep (9)
#
# Auswertung: rollout/torso_height (steigt vs. Robb-Baseline 0.285?) IMMER gegen
# rollout/distance + is_success prüfen. Ziel: höhere Höhe BEI erhaltener Distanz.
# Warnsignal: Malus zu hart → distance/ep_len_mean brechen ein (Agent fällt lieber
# sofort, statt der Dauerstrafe standzuhalten) → upright_weight runter.
---
program: scripts/train.py
method: grid

metric:
  name: rollout/torso_height
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config
  - configs/ppo_reward_sweep_base.yaml
  - --tags
  - sweep
  - reward
  - penalty

parameters:
  env.reward_shaping.upright_weight:
    # Kalibriert: Basis-Reward ~0.08/Step. weight 10-40 ergab -0.65/Step Malus
    # (~50-100x zu gross) → Agent starb sofort. 0.05-0.2 = selbe Liga wie Basis.
    values: [0.05, 0.1, 0.2]
  env.reward_shaping.height_threshold:
    values: [0.35, 0.40, 0.45]
