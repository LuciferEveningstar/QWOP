# Verifikations-Run: 100k Steps, prüft ob ep_rew_mean / ep_len_mean nach
# dem Monitor-Wrapper-Fix in W&B auftauchen. ~5 min auf M-Series.
algorithm: PPO

env:
  id: QWOP-v1
  kwargs: {}

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 100_000
  seed: 42
  n_envs: 1

paths:
  log_dir: logs/ppo_verify100k
  model_dir: models/ppo_verify100k
