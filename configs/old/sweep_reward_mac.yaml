# Mac-Variante des Robben-Malus-Sweeps (zeigt auf ppo_reward_sweep_base_mac.yaml,
# n_envs=2, 2M Steps). Voller 9er-Sweep auf dem MacBook.
#
# Auf dem Mac funktioniert ${interpreter} (anders als Windows) — kein Pfad-Fix nötig.
#
# Ablauf (Mac, venv aktiv, Rechner wach halten via caffeinate -d &):
#   wandb sweep --project qwop-rl-dhbw --entity qwop-rl configs/sweep_reward_mac.yaml
#   wandb agent qwop-rl/qwop-rl-dhbw/<sweep-id>              # voller Sweep (9, ~6-8h)
---
program: scripts/train.py
method: grid

metric:
  name: rollout/torso_height
  goal: maximize

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config
  - configs/ppo_reward_sweep_base_mac.yaml
  - --tags
  - sweep
  - reward
  - penalty
  - mac

parameters:
  env.reward_shaping.upright_weight:
    # Neu kalibriert: Basis-Reward ist ~0.08/Step. weight 10-40 ergab -0.65/Step
    # Malus (~50-100x zu gross) → Agent starb sofort. 0.05-0.2 spielt in derselben
    # Liga wie der Basis-Reward: Robben unattraktiv, ohne 'sofort sterben'.
    values: [0.05, 0.1, 0.2]
  env.reward_shaping.height_threshold:
    values: [0.35, 0.40, 0.45]
