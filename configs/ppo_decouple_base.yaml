# Basis-Config: Basis-Reward ERSETZT — entkoppelt Speed von Distanz.
#
# Problem: qwop-gyms Reward summiert sich fast 1:1 zur Distanz → Agent optimiert
# "weit", nicht "schnell". Hier ersetzt der Wrapper den Basis-Reward durch
# distance_weight*Δdistanz - time_penalty*Δzeit (+ Ziel/Sturz-Boni). Kleiner
# distance_weight + hohe time_penalty → Tempo dominiert.
#
# Torso-Sperre bleibt an (upright 0.2 / threshold 0.45), damit er nicht flach robbt.
# Startet vom gruenen 7M-Checkpoint (t050, liegt auf dem Mac).
algorithm: PPO

env:
  id: QWOP-v1
  kwargs:
    time_cost_mult: 10        # egal — Basis-Reward wird eh ersetzt
    failure_cost: 10
  reward_shaping:
    enabled: true
    replace_base: true        # Basis-Reward ersetzen (Kern dieses Experiments)
    distance_weight: 0.05     # vom Sweep überschrieben — klein = Distanz zaehlt wenig
    time_penalty: 10.0        # vom Sweep überschrieben — hoch = Tempo zaehlt
    upright_weight: 0.2       # Torso-Sperre bleibt
    height_threshold: 0.45
    gate_on_forward: true
    penalty_below: true
    speed_weight: 0.0         # aus (summiert sich sonst wieder zu Distanz)
    gait_weight: 0.0

ppo:
  policy: MlpPolicy
  learning_rate: 1.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 9_000_000    # vom 7M-Checkpoint weiter → +2M pro Trial
  model_load_file: "models/gruen162806_t050/ckpt_7009984_steps.zip"
  seed: 42
  n_envs: 2                     # MacBook Air 8GB
  checkpoint_freq: 200_000

paths:
  log_dir: logs/ppo_decouple
  model_dir: models/ppo_decouple
