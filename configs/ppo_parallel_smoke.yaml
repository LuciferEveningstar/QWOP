# Parallel-Smoke: verifiziert SubprocVecEnv + Auto-Headless end-to-end.
# 4 Worker, winziges Budget (~Sekunden). KEIN echtes Training — nur der Beweis,
# dass 4 headless Env-Prozesse spawnen, steppen und sauber schließen.
#
# Ausführen (eigenes Terminal, venv aktiv):
#   python scripts/train.py --config configs/ppo_parallel_smoke.yaml --no-wandb
# Danach prüfen, dass nichts hängen blieb:
#   pgrep -fl chromedriver   # sollte leer sein
algorithm: PPO

env:
  id: QWOP-v1
  kwargs: {}

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 64
  n_epochs: 3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 8_000     # 4 envs × 512 n_steps = 2048/rollout → wenige Rollouts
  seed: 42
  n_envs: 4                  # >1 → SubprocVecEnv + Auto-Headless

paths:
  log_dir: logs/ppo_parallel_smoke
  model_dir: models/ppo_parallel_smoke
